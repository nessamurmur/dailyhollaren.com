<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Black Chapel performs in a Toronto basement</title>
  <desc id="desc">Wide editorial cartoon of a four-piece heavy band playing beneath basement pipes while an ecstatic crowd reaches toward the stage.</desc>
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
