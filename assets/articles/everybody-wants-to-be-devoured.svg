      <path d="M-3 18L18-3M8 24L24 8" stroke="#eae4d8" stroke-width=".8" opacity=".06"/>
    </pattern>
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence baseFrequency=".012" numOctaves="2" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#eae4d8"/>
      <stop offset=".46" stop-color="#d48c90"/>
      <stop offset="1" stop-color="#bd2b2d" stop-opacity="0"/>
    </radialGradient>
  </defs>

